<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMWare - Construction Management</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-section">
                <div class="logo">
                    <span class="logo-cm">CM</span><span class="logo-ware">ware</span>
                </div>
                <p class="tagline">Construction Project Management</p>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="login">Sign In</button>
                <button class="tab" data-tab="signup">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="you@company.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me"> Remember me
                    </label>
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
                <div id="login-error" class="error-message"></div>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" class="auth-form">
                <div class="avatar-upload">
                    <div class="avatar-preview" id="avatar-preview">
                        <svg class="default-avatar" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="50" cy="50" r="50" fill="#e0e0e0"/>
                            <circle cx="50" cy="38" r="16" fill="#bdbdbd"/>
                            <ellipse cx="50" cy="75" rx="26" ry="20" fill="#bdbdbd"/>
                        </svg>
                    </div>
                    <label for="avatar-input" class="avatar-label">Upload Photo</label>
                    <input type="file" id="avatar-input" accept="image/*" hidden>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="signup-firstname">First Name</label>
                        <input type="text" id="signup-firstname" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-lastname">Last Name</label>
                        <input type="text" id="signup-lastname" placeholder="Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="you@company.com" required>
                </div>

                <div class="form-group">
                    <label for="signup-phone">Phone Number</label>
                    <input type="tel" id="signup-phone" placeholder="(555) 123-4567" required>
                </div>

                <div class="form-group">
                    <label for="signup-company">Company</label>
                    <input type="text" id="signup-company" placeholder="e.g. Turner Construction">
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Create a password" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="signup-confirm">Confirm Password</label>
                    <input type="password" id="signup-confirm" placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="btn-primary">Create Account</button>
                <div id="signup-error" class="error-message"></div>
            </form>
        </div>

        <div class="auth-footer">
            <p>&copy; 2026 CMWare. All rights reserved.</p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
